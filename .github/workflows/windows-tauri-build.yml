name: Windows Tauri Build

# Also runs on pushes to the default branch: caches saved there are the only
# ones a tag-triggered release run is allowed to restore (Actions cache scoping
# is per-ref + default branch, and every release tag is a fresh ref), so the
# main build is what keeps the release workflow's Rust cache warm.
on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
          # Same key the release workflow restores — see the trigger comment.
          shared-key: windows-release

      - name: Install Node dependencies
        run: npm ci

      - name: Build Tauri app
        # --no-bundle: this is a CI/cache-warming build, not a release. Skipping
        # the bundle avoids producing updater artifacts, which would otherwise
        # require the signing key (only the release workflow has it).
        run: npm run tauri build -- --no-bundle

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: palcalc-windows
          path: src-tauri/target/release/*.exe
