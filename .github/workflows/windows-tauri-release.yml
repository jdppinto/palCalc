name: Windows Tauri Release

permissions:
  contents: write

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  release-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
          shared-key: windows-release

      - name: Install Node dependencies
        run: npm ci

      # tauri-action builds the frontend + Rust, bundles the NSIS installer,
      # signs it and the updater artifacts with the repo's signing secret, then
      # creates the GitHub release for this tag and uploads the installer, its
      # .sig, and latest.json. The app's updater endpoint reads that latest.json
      # from releases/latest/download/, so only non-prerelease tags are served.
      - name: Build, sign, and publish release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Baked in at compile time (option_env!) so the exe knows the tag it
          # was built from and shows PRE-RELEASE for a hyphenated tag.
          PALCALC_RELEASE_TAG: ${{ github.ref_name }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: ${{ github.ref_name }}
          releaseBody: "Download and run the Windows installer below. Once installed, PalCalc keeps itself up to date automatically."
          # Semver pre-identifiers (v0.5.1-rc.7) are hyphenated: mark those as
          # prereleases so they never claim the "Latest" badge or get served
          # to the auto-updater.
          prerelease: ${{ contains(github.ref_name, '-') }}
          releaseDraft: false
