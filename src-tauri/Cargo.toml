[workspace]
members = ["core"]

[package]
name = "palcalc"
version = "0.5.0"
edition = "2021"

[lib]
name = "palcalc_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
palcalc-core = { path = "core" }
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
image = { version = "0.25.10", default-features = false, features = ["png"] }
include_dir = "0.7.4"
base64 = "0.22.1"
ab_glyph = "0.2.32"
rayon = "1.12.0"
ocrs = "0.12.2"
rten = "0.24.0"
strsim = "0.11.1"

[target.'cfg(target_os = "linux")'.dependencies]
libwayshot = "0.8.0"
