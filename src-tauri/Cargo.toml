[workspace]
members = ["core"]

[package]
name = "palcalc"
version = "0.8.1"
edition = "2021"

[lib]
name = "palcalc_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
palcalc-core = { path = "core" }
tauri = { version = "2", features = [] }
# Self-update: check GitHub releases for a signed newer build, download and
# install it, then relaunch. Windows target (NSIS) only for now.
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
image = { version = "0.25.10", default-features = false, features = ["png"] }
include_dir = "0.7.4"
base64 = "0.22.1"
ab_glyph = "0.2.32"
rayon = "1.12.0"
ocrs = "0.12.2"
rten = "0.24.0"
strsim = "0.11.1"

# Server mode: pinned HTTPS client to talk to palcalc-server. rustls-tls only
# (custom fingerprint-pinning verifier), no native-tls, no bundled CA roots.
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls-manual-roots"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12", "logging"] }
sha2 = "0.10"

[target.'cfg(target_os = "linux")'.dependencies]
libwayshot = "0.8.0"
